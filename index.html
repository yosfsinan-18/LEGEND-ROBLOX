<!DOCTYPE html>
<html lang="ku" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUSEF STORE - DNS Security Platform</title>
    <style>
        body {
            background-color: #080c14;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .logo-circle {
            width: 80px; height: 80px;
            background: radial-gradient(circle, rgba(56,189,248,0.2) 0%, rgba(8,12,20,0.8) 80%);
            border: 2px solid #38bdf8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            font-size: 30px;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #fbbf24;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }
        .card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }
        .section-title {
            color: #38bdf8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }
        .row {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .row span:first-child { color: #94a3b8; font-size: 14px; }
        .row span:last-child { color: #38bdf8; font-weight: 700; font-size: 14px; }
        .snap { color: #fbbf24 !important; }
        
        .active-header {
            text-align: right;
            color: #38bdf8;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .install-box {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-weight: 800;
            font-size: 15px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: 0.2s;
        }
        .btn.done {
            background: linear-gradient(135deg, #059669, #10b981) !important;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4) !important;
        }
        .info { text-align: left; }
        .info h3 { margin: 0 0 4px 0; font-size: 15px; color: #ffffff; }
        .info p { margin: 0; font-size: 11px; color: #64748b; }
        .icon-box {
            background: rgba(30, 41, 59, 0.8);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        #loader {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 12, 20, 0.9);
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .spinner {
            width: 70px; height: 70px;
            border: 6px solid rgba(56, 189, 248, 0.1);
            border-top: 6px solid #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #percent { margin-top: 20px; font-size: 24px; font-weight: 800; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-circle">👑</div>
        <h1>YUSEF STORE</h1>
        <div class="subtitle">DNS Security Platform</div>

        <div class="card">
            <div class="section-title">✨ DEVELOPER CHANNELS ✨</div>
            <div class="row">
                <span>Snapchat</span>
                <span class="snap">K4BOOS_SURCHI</span>
            </div>
            <div class="row">
                <span>TikTok</span>
                <span>yousef_surchi</span>
            </div>
            <div class="row">
                <span>Telegram</span>
                <span>YUSEF_SURCHI</span>
            </div>
        </div>

        <div class="active-header">ACTIVE PROFILE 📦</div>
        <div class="install-box">
            <button id="installBtn" class="btn" onclick="startInstall()">INSTALL</button>
            <div class="info">
                <h3>DNS Security Profile</h3>
                <p>Anti-Revoke Protection</p>
            </div>
            <div class="icon-box">🌐</div>
        </div>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <div id="percent">0%</div>
    </div>

    <script>
        function startInstall() {
            var loader = document.getElementById("loader");
            var percentText = document.getElementById("percent");
            var btn = document.getElementById("installBtn");
            
            loader.style.display = "flex";
            var currentPercent = 0;
            
            var interval = setInterval(function() {
                currentPercent += 10;
                percentText.innerText = currentPercent + "%";
                if (currentPercent >= 100) {
                    clearInterval(interval);
                    setTimeout(function() {
                        loader.style.display = "none";
                        btn.innerText = "DONE";
                        btn.classList.add("done");
                        window.location.href = "dns.mobileconfig";
                    }, 200);
                }
            }, 150);
        }
    </script>
</body>
</html>
